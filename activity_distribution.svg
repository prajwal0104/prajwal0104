<svg xmlns="http://www.w3.org/2000/svg" width="450" height="200" viewBox="0 0 450 200" fill="none">
  <defs>
    <linearGradient id="actBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="actShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="450" height="200" rx="14" fill="url(#actBg)" stroke="#334155" stroke-width="1.5" filter="url(#actShadow)"/>

  <!-- Title -->
  <g transform="translate(26, 32)">
    <text font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="-0.3">
      🎯 Activity Overview &amp; Contribution Ratio
    </text>
    <text font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#94a3b8" y="16">
      Target balance across engineering lifecycle contributions
    </text>
  </g>

  <!-- Progress Bar -->
  <rect x="26" y="70" width="398" height="10" rx="5" fill="#334155"/>
  <rect x="26" y="70" width="298" height="10" rx="3" fill="#238636"/><rect x="325" y="70" width="48" height="10" rx="3" fill="#8957e5"/><rect x="374" y="70" width="36" height="10" rx="3" fill="#d29922"/><rect x="411" y="70" width="13" height="10" rx="3" fill="#38bdf8"/>

  <!-- Legends -->
  <g transform="translate(26, 104)">
          <circle cx="5" cy="5" r="5" fill="#238636"/>
          <text x="16" y="9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Commits</text>
          <text x="130" y="9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="end">75% (62)</text>
        </g><g transform="translate(216, 104)">
          <circle cx="5" cy="5" r="5" fill="#8957e5"/>
          <text x="16" y="9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Pull Requests</text>
          <text x="130" y="9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="end">12% (10)</text>
        </g><g transform="translate(26, 128)">
          <circle cx="5" cy="5" r="5" fill="#d29922"/>
          <text x="16" y="9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Issues</text>
          <text x="130" y="9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="end">9% (8)</text>
        </g><g transform="translate(216, 128)">
          <circle cx="5" cy="5" r="5" fill="#38bdf8"/>
          <text x="16" y="9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Code Review</text>
          <text x="130" y="9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="end">4% (3)</text>
        </g>
</svg>