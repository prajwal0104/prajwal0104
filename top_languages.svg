<svg xmlns="http://www.w3.org/2000/svg" width="450" height="200" viewBox="0 0 450 200" fill="none">
  <defs>
    <linearGradient id="langBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="langShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="450" height="200" rx="14" fill="url(#langBg)" stroke="#334155" stroke-width="1.5" filter="url(#langShadow)"/>

  <!-- Title -->
  <g transform="translate(26, 32)">
    <text font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="-0.3">
      💻 Codebase Language Distribution
    </text>
    <text font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#94a3b8" y="16">
      Computed across all production code repositories
    </text>
  </g>

  <!-- Progress Bar -->
  <rect x="26" y="70" width="398" height="10" rx="5" fill="#334155"/>
  <rect x="26" y="70" width="344" height="10" rx="3" fill="#e34c26"/><rect x="371" y="70" width="53" height="10" rx="3" fill="#3572A5"/>

  <!-- Legends -->
  <g transform="translate(26, 104)">
          <circle cx="5" cy="5" r="5" fill="#e34c26"/>
          <text x="16" y="9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">HTML</text>
          <text x="130" y="9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="end">86.4%</text>
        </g><g transform="translate(216, 104)">
          <circle cx="5" cy="5" r="5" fill="#3572A5"/>
          <text x="16" y="9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Python</text>
          <text x="130" y="9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="end">13.6%</text>
        </g>
</svg>